[package]
name = "vfxforge-desktop"
version = "0.1.0"
edition = "2021"
description = "VFXForge desktop shell (Tauri 2): a thin command layer over vfxforge-native"
license = "MIT"
publish = false

[lib]
name = "vfxforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vfxforge-native = { path = "../../../native/vfxforge-native" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
png = "0.18.1"
